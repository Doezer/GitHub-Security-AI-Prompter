<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Security AI Prompter</title>
  <style>
    body { width: 350px; padding: 10px; font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; color: #111827; }
    h3 { margin-top: 0; font-size: 14px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    button { 
      width: 100%; padding: 10px; margin-bottom: 10px; 
      background-color: #2563eb; color: white; border: none; 
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:hover { background-color: #1d4ed8; }
    textarea { 
      width: 100%; height: 200px; resize: none; 
      padding: 8px; border: 1px solid #d1d5db; border-radius: 4px;
      box-sizing: border-box; font-family: monospace; font-size: 12px;
    }
  </style>
</head>
<body>
  <h3>GitHub Security AI Prompter</h3>
  <button id="extractBtn">Generate & Copy Prompt</button>
  <label for="result" class="sr-only">Generated prompt</label>
  <textarea id="result" placeholder="Your AI prompt will appear here..."></textarea>
  <script src="popup.js"></script>
</body>
</html>
